    steps:
      - name: Ping Supabase dev project
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://wsmwmlohwymmstevibjn.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.sb_publishable_H7hB_zTRvjtMSZnbr00GWw_HW3GcMHS }}" \
